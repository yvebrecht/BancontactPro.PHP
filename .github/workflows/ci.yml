name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ["8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: openssl, json
          tools: composer:v2

      - name: Install
        run: composer install --no-interaction --prefer-dist

      - name: Validate
        run: composer validate --strict

      - name: Lint
        run: composer lint

      - name: Static analysis
        run: composer analyse

      - name: Test
        run: composer test

  build:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2

      # Builds the archive only; there is deliberately no publish or release step.
      - name: Build archive
        run: composer archive --format=zip --dir=dist
